<!--
  Monogram Belmont. Dipakai sebagai favicon tab browser.

  Dibuat tebal dan dengan rongga (counter) yang lega karena ukuran tampilnya
  16 CSS px. Apa pun yang lebih halus dari ini jadi bubur. Warnanya kebalikan
  dari situs — latar terang, huruf gelap — supaya tetap terbaca di bilah tab
  gelap maupun terang. Ikon gelap akan lenyap di tab bar gelap.

  Geometri ditulis manual, bukan hasil ekspor editor: berkas kembarannya
  (favicon.ico, apple-touch-icon.png) dibangkitkan dari angka yang sama persis
  lewat skrip. Kalau mengubah bentuk di sini, ubah juga di sana.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="kilau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#00ffa3"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#kilau)"/>
  <path fill="#0d0e13" fill-rule="evenodd" d="
    M24 20 H52 A15 15 0 0 1 52 50 H24 Z
    M24 50 H54 A15 15 0 0 1 54 80 H24 Z
    M38 30 H49 A5 5 0 0 1 49 40 H38 Z
    M38 60 H51 A5 5 0 0 1 51 70 H38 Z
  "/>
</svg>
